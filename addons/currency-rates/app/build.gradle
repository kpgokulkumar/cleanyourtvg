plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cleanyourtv.rates'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cleanyourtv.rates'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '1.8'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}



dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
